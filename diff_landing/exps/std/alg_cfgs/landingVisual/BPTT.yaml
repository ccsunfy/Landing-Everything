algorithm:
  policy: SimplePolicy
  policy_kwargs:
    features_extractor_class: FlexibleExtractor
    features_extractor_kwargs:
      net_arch:
        state:
          layer: [192]
        semantic:
          layer: [256, 256]
        # color:
        #   layer: [256, 256]
    critic:
      dist: symlog_disc
      n_critics: 1
      net_arch:
        layer: [192, 96]
    actor:
      dist: tanh_normal
#      squash_output: False
      net_arch:
        layer: [192, 96]
#    ln: Trueq
    activation_fn: relu
    optimizer_class: adam
    optimizer_kwargs:
      weight_decay: 0.00001
  learning_rate:
    class: exponential
    kwargs:
      initial: 0.001
      decay: 0.01
  horizon: 96   # 96 配合 500 env 易 OOM，缩短以省显存
  tau: 0.005
  gamma: 0.99
  device: cuda
  tensorboard_log: null   # 设为 null 时使用 save_path；可改为如 "logs/landingVisual" 指定目录
  # gradient_steps: 10
  # train_freq: 96
  # batch_size: 25600   # 减小以省显存
  gradient_steps: 10
  train_freq: 96
  batch_size: 25600   # 减小以省显存
  actor_gradient_steps: 1

learn:
  total_timesteps: 80000000
  log_interval: 1

test:
  is_fig: True
  is_fig_save: True
  is_video: True
  is_video_save: True
  render_kwargs: { }