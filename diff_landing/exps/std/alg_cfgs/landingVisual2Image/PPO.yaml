algorithm:
  policy: CustomMultiInputPolicy
  policy_kwargs:
    features_extractor_class: StateImageExtractor
    features_extractor_kwargs:
      net_arch:
        state:
          layer: [192]
        semantic:
          layer: [256, 256]
    net_arch:
      pi: [192, 96]
      vf: [192, 96]
    activation_fn: relu
    optimizer_kwargs:
      weight_decay: 0.00001
    share_features_extractor: True   # True 可节省显存（policy/value 共享特征）
  learning_rate: 0.0001
  device: cuda
  gamma: 0.99
  gae_lambda: 0.95
  n_epochs: 5
  n_steps: 256
  # batch_size: 25600   # 减小以缓解 OOM（原 25600 一次处理过多样本）
  batch_size: 12800
  verbose: 1

learn:
  total_timesteps: 50000000

test:
  is_fig: True
  is_fig_save: True
  is_video: True
  is_video_save: True
  render_kwargs: {}


