env:
  num_agent_per_scene: 20   # 100 会 OOM，40*5=200 envs 较稳妥
  num_scene: 5
  max_episode_steps: 500
  # semantic_normalize: true   # 与真机输入对齐：semantic /255
  semantic_binary_mask: false # 仅平台为 255、背景为 0；与真机二值分割对齐
  semantic_platform_ids: [255]  # 视为「平台」的原始 semantic_id；object 全改为 255 后可改为 [255]
  # semantic_in_obs: false   # 消融：semantic 仅用于 reward（视觉对齐），不进入 policy 观测
  sensor_kwargs:
    - sensor_type: SEMANTIC
      uuid: semantic
      resolution:
        - 48
        - 64
      position:
        - 0
        - 0.0
        - -0.03
      orientation:
        - -np.pi / 2
        - 0
        - 0
    # - sensor_type: COLOR
    #   uuid: color
    #   resolution:
    #     - 640
    #     - 480
    #   position:
    #     - 0
    #     - 0.0
    #     - -0.05
    #   orientation:
    #     - -np.pi / 2
    #     - 0
    #     - 0
  scene_kwargs:
    # path: VisFly/datasets/visfly-beta/configs/scenes/apriltag
    # path: VisFly/datasets/visfly-beta/configs/scenes/landing_yuantong
    # path: VisFly/datasets/visfly-beta/configs/scenes/landing_cylinder
    # obj_settings: {"path": "platform",}
    # path: VisFly/datasets/visfly-beta/configs/scenes/landing_cube_test
    path: VisFly/datasets/visfly-beta/configs/scenes/landing_random_platform
  dynamics_kwargs:
    dt: 0.01
    ctrl_dt: 0.03
    comm_delay: 0.12
    ctrl_delay: True
    action_type: "bodyrate"
  visual: True
  device: cpu
  requires_grad: True
  tensor_output: True
  # requires_grad: False
  # tensor_output: False

eval_env:
  num_agent_per_scene: 1
  num_scene: 1
  max_episode_steps: 500
  # semantic_normalize: true
  semantic_binary_mask: false
  semantic_platform_ids: [255]
  tensor_output: True
  scene_kwargs:
    # path: VisFly/datasets/visfly-beta/configs/scenes/apriltag
    # path: VisFly/datasets/visfly-beta/configs/scenes/landing_cube_test
    path: VisFly/datasets/visfly-beta/configs/scenes/landing_random_platform
    # path: VisFly/datasets/visfly-beta/configs/scenes/landing_cylinder
    # obj_settings: {"path": "platform",}
    # path: VisFly/datasets/visfly-beta/configs/scenes/landing_triangle
    # path: VisFly/datasets/visfly-beta/configs/scenes/landing_cylinder
    # path: VisFly/datasets/visfly-beta/configs/scenes/landing_yuantong
    render_settings:
      mode: fix
      view: custom
      resolution: [1080,1920]
      # position: [[7., 6.8, 5.5], [7, 4.8, 4.5]]
      position: [[0.5, -4.7, 5.0], [2.5, -2.8, 3.5]]
      axes: False
      line_width: 5.5
      trajectory: True
      
